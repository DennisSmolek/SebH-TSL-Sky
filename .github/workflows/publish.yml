name: Publish to npm

# Triggered by pushing a `v*` tag (e.g. `v0.1.1`). The tag's commit must
# match the version in `package.json` — `npm publish` will fail otherwise.
#
# Auth: npm Trusted Publishing (OIDC). No NPM_TOKEN secret needed —
# GitHub Actions exchanges an OIDC token for npm publish credentials at
# runtime. Configure the trusted publisher on npmjs.com:
#   tsl-sky → Settings → Publishing → Trusted Publishers
#   - Publisher: GitHub Actions
#   - Repository: DennisSmolek/SebH-TSL-Sky
#   - Workflow filename: publish.yml
#
# Trusted Publishing requires npm CLI 11.5.1+, so we upgrade npm before
# the publish step (Node 20 ships npm 10.x).
#
# Manual cut: `git tag v0.1.1 && git push --tags`.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for npm provenance + Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      - run: npm ci

      # Sanity check: the version on the tag matches package.json.
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${PKG_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      - run: npm publish --provenance --access public
