<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>05 — Planet-scale (Mode B + sphere ground + extended AP)</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #eee; overflow: hidden; font-family: system-ui, sans-serif; }
			#info {
				position: absolute; top: 8px; left: 8px; padding: 6px 10px;
				background: rgba(0,0,0,0.5); border-radius: 4px; font-size: 12px;
				pointer-events: none; z-index: 10;
			}
			canvas { display: block; }
		</style>
	</head>
	<body>
		<div id="info">
			Planet-scale — sphere ground, orbit-altitude camera, extended AP coverage.<br>
			Stable counterpart: <a href="/examples/04-live-sky.html" style="color:#fc9">04-live-sky</a>
		</div>
		<script type="module">
			import * as THREE from 'three/webgpu';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

			import { pass, uniform } from 'three/tsl';

			import { SkyAtmosphereBaker } from '/src/sky/SkyAtmosphereBaker.js';
			import { createHazeOutputNode } from '/src/sky/HazePostProcess.js';
			import { createStartGate, logStage } from '/src/demo/startGate.js';

			const debugMode = new URLSearchParams( window.location.search ).get( 'debug' );

			// AP coverage policy for this demo. 32 km/slice × 32 slices ≈ 1024 km.
			// Tradeoff: close-range slice 0 spans 32 km instead of 8, so haze on
			// nearby geometry is coarser — fine for orbit views, would degrade
			// the ground-level demo. That's why 04 keeps the default 8 and 05
			// is a separate page.
			const AP_KM_PER_SLICE = 32.0;

			const gate = createStartGate( {
				label: 'Start Planet-scale demo',
				stages: [
					'create WebGPU renderer',
					'renderer.init()',
					'baker (LUTs + cube + AP @ 1024 km)',
					'build planet scene',
					'set up haze post-process',
					'render loop'
				]
			} );

			gate.run( async ( { markStage } ) => {

				markStage( 0, 'running' );
				const renderer = new THREE.WebGPURenderer( { antialias: false } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.5;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );
				markStage( 1, 'running' );

				await logStage( 'renderer.init()', () => renderer.init() );
				markStage( 2, 'running' );

				// Far plane large enough to enclose the full planet sphere when
				// looking down from orbit. Earth radius ≈ 6.36 Mm so 20 Mm
				// comfortably covers the diameter plus altitude headroom.
				const camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 1, 20_000_000 );
				camera.position.set( 0, 200, 0 );
				camera.lookAt( 0, 200, 1000 );

				const baker = await logStage( 'SkyAtmosphereBaker', async () => {

					const b = new SkyAtmosphereBaker( renderer, {
						cubeSize: 256,
						enableAerialPerspective: true,
						apKmPerSlice: AP_KM_PER_SLICE
					} );
					b.setSun( { elevation: 8, azimuth: 0 } );
					b.setCamera( camera );
					b.update();
					await b.updateAerialPerspective();
					await renderer.getContext().queue?.onSubmittedWorkDone?.();
					return b;

				} );
				markStage( 3, 'running' );

				const scene = new THREE.Scene();

				// Live sky mesh — Mode B. Sky-View LUT is sampled per-pixel
				// against the current camera; raymarch fallback above topRadius.
				const skyMesh = baker.createSkyMesh();
				scene.add( skyMesh );

				scene.environment = baker.environmentTexture;

				// Planet sphere — locally indistinguishable from a flat plane,
				// but reveals planetary curvature from altitude. Centred at
				// (0, -bottomRadius_m, 0) so the surface sits at y = 0.
				const bottomRadiusM = baker.atmosphereParams.bottomRadius * 1000;
				const groundMat = new THREE.MeshStandardMaterial( { color: 0x6a6055, roughness: 0.95, metalness: 0.0 } );
				const ground = new THREE.Mesh(
					new THREE.SphereGeometry( bottomRadiusM, 128, 64 ),
					groundMat
				);
				ground.position.y = - bottomRadiusM;
				scene.add( ground );

				const sunLight = new THREE.DirectionalLight( 0xffffff, 4.0 );
				scene.add( sunLight );

				const sunVec = new THREE.Vector3();
				const updateSunLight = () => {

					sunVec.copy( baker._sunVec ).multiplyScalar( 50000 );
					sunLight.position.copy( sunVec );
					sunLight.target.position.set( 0, 0, 0 );

				};
				updateSunLight();

				// Mountain scatter so haze gradient is visible at low altitude.
				const mountainGeom = new THREE.ConeGeometry( 1, 1, 12 );
				const mountainMat = new THREE.MeshStandardMaterial( { color: 0x4a3f33, roughness: 0.9 } );
				for ( let i = 1; i <= 12; i ++ ) {

					const dist = i * 2000;
					const angle = ( i % 4 - 1.5 ) * 0.4;
					const m = new THREE.Mesh( mountainGeom, mountainMat );
					const h = 400 + Math.random() * 400;
					m.scale.set( 600, h, 600 );
					m.position.set( Math.sin( angle ) * dist, h / 2, Math.cos( angle ) * dist );
					scene.add( m );

				}
				for ( let i = 0; i < 6; i ++ ) {

					const dist = 30000 + i * 8000;
					const angle = ( i - 2.5 ) * 0.15;
					const m = new THREE.Mesh( mountainGeom, mountainMat );
					const h = 1500;
					m.scale.set( 1500, h, 1500 );
					m.position.set( Math.sin( angle ) * dist, h / 2, Math.cos( angle ) * dist );
					scene.add( m );

				}

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 200, 1000 );
				controls.enableDamping = true;
				controls.minDistance = 10;
				controls.maxDistance = 1_000_000;

				markStage( 4, 'running' );

				const scenePass = pass( scene, camera );
				const luminanceScaleU = baker.sky.luminanceScale;
				const invProjU = uniform( camera.projectionMatrixInverse.clone() );
				const cameraWorldU = uniform( camera.matrixWorld.clone() );
				// camera.far is large (20 Mm) for orbit views; opt-in to
				// the viewZ-based sky-pixel test so AP doesn't double up
				// the sky-mesh's gradient at the top of the screen.
				const cameraFarU = uniform( camera.far );
				const hazeStrengthU = uniform( 1.0 );
				// 0 = use AP LUT for in-coverage geometry (fast path).
				// 1 = bypass the LUT entirely; every geometry pixel goes through
				// per-pixel `integrateScatteredLuminance`. Useful at orbit
				// altitude where the LUT's frustum-aligned voxel grid produces
				// directional coverage holes.
				const raymarchOnlyU = uniform( 0.0 );

				const renderPipeline = new THREE.RenderPipeline( renderer );
				renderPipeline.outputNode = createHazeOutputNode( {
					scenePass,
					aerialPerspectiveTexture: baker.aerialPerspectiveTexture,
					luminanceScale: luminanceScaleU,
					invProjUniform: invProjU,
					cameraWorldUniform: cameraWorldU,
					cameraFarUniform: cameraFarU,
					hazeStrength: hazeStrengthU,
					kmPerSlice: AP_KM_PER_SLICE,
					// Per-pixel raymarch fallback — geometry past 1024 km integrates
					// the real atmosphere instead of clamping to slice 31 of the
					// AP LUT. Required for orbit views of the planet sphere; without
					// this, the far hemisphere of the planet reads as unhazed.
					enableRaymarchFallback: true,
					atmosphereUniforms: baker.atmosphereUniforms,
					sunDirection: baker.sky.sunDirection,
					viewHeightKm: baker.sky.viewHeight,
					transmittanceLUT: baker.transmittanceLUT.texture,
					multiScatterLUT: baker.multiScatterLUT.texture,
					raymarchOnlyUniform: raymarchOnlyU,
					debugMode
				} );

				const gui = renderer.inspector.createParameters( 'Atmosphere' );
				const eff = {
					sunElevation: 8,
					sunAzimuth: 0,
					cameraAltitude: 200,
					exposure: 0.5,
					hazeStrength: 1.0,
					hazeOn: true,
					// Isolation toggles — flip one off to figure out which system
					// is producing a given on-screen artefact.
					//   skyMeshOn  — the SkyAtmosphereMesh that renders the actual
					//                visible sky (Sky-View LUT below topRadius +
					//                space-view raymarch above). When off the sky
					//                shows whatever the renderer clears to (black);
					//                the planet surface still has AP haze.
					//   hazeOn     — the AP post-process. When off the planet
					//                surface renders without atmospheric haze; the
					//                sky-mesh still draws.
					skyMeshOn: true,
					// Bypass the AP LUT and raymarch every geometry pixel. The LUT
					// is fast and accurate at ground level, but its voxel
					// parameterization breaks down at altitude on off-axis views.
					hazeRaymarchOnly: false
				};
				gui.add( eff, 'sunElevation', - 5, 90, 0.1 ).onChange( () => { baker.setSun( { elevation: eff.sunElevation, azimuth: eff.sunAzimuth } ); updateSunLight(); } );
				gui.add( eff, 'sunAzimuth', - 180, 180, 0.1 ).onChange( () => { baker.setSun( { elevation: eff.sunElevation, azimuth: eff.sunAzimuth } ); updateSunLight(); } );
				gui.add( eff, 'cameraAltitude', 1, 500000, 1 ).onChange( () => {
					const dy = eff.cameraAltitude - camera.position.y;
					camera.position.y = eff.cameraAltitude;
					controls.target.y += dy;
					controls.update();
				} );
				gui.add( eff, 'exposure', 0, 2, 0.01 ).onChange( () => { renderer.toneMappingExposure = eff.exposure; } );
				gui.add( eff, 'hazeStrength', 0, 3, 0.01 ).onChange( () => { hazeStrengthU.value = eff.hazeOn ? eff.hazeStrength : 0; } );
				gui.add( eff, 'hazeOn' ).onChange( () => { hazeStrengthU.value = eff.hazeOn ? eff.hazeStrength : 0; } );
				gui.add( eff, 'skyMeshOn' ).onChange( () => { skyMesh.visible = eff.skyMeshOn; } );
				gui.add( eff, 'hazeRaymarchOnly' ).onChange( () => { raymarchOnlyU.value = eff.hazeRaymarchOnly ? 1 : 0; } );

				window.addEventListener( 'resize', () => {

					camera.aspect = window.innerWidth / window.innerHeight;
					camera.updateProjectionMatrix();
					renderer.setSize( window.innerWidth, window.innerHeight );

				} );

				markStage( 5, 'running' );

				renderer.setAnimationLoop( async () => {

					controls.update();

					// Sky-mesh box must follow the camera. RenderPipeline passes
					// don't trigger onBeforeRender consistently, so set it here.
					skyMesh.position.copy( camera.position );

					baker.setCamera( camera );
					invProjU.value.copy( camera.projectionMatrixInverse );
					cameraWorldU.value.copy( camera.matrixWorld );

					try {

						baker.update();

					} catch ( err ) {

						console.error( '[animate] baker.update() failed:', err );
						renderer.setAnimationLoop( null );
						return;

					}

					await baker.updateAerialPerspective();

					if ( scene.environment !== baker.environmentTexture ) {

						scene.environment = baker.environmentTexture;

					}

					await renderPipeline.renderAsync();

				} );

			} );
		</script>
	</body>
</html>
